<!-- Main Content -->
<div class="container my-4">
    <h2 class="text-center mb-4">영화 정보 수정</h2>
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- 기존 데이터를 수정할 수 있도록 Form 생성 -->
            <form th:action="@{/movie/modify/{id}(id=${movie.id})}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" class="form-control" id="title" name="title" th:value="${movie.title}" required/>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">설명</label>
                    <textarea class="form-control" id="description" name="description" rows="3" th:text="${movie.description}" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="genre" class="form-label">장르</label>
                    <input type="text" class="form-control" id="genre" name="genre" th:value="${movie.genre}" required/>
                </div>

                <div class="mb-3">
                    <label for="releaseDate" class="form-label">개봉일</label>
                    <input type="date" class="form-control" id="releaseDate" name="releaseDate" th:value="${movie.releaseDate}" required/>
                </div>

                <div class="mb-3">
                    <label for="director" class="form-label">감독</label>
                    <input type="text" class="form-control" id="director" name="director" th:value="${movie.director}" required/>
                </div>

                <div class="mb-3">
                    <label for="actors" class="form-label">출연자</label>
                    <input type="text" class="form-control" id="actors" name="actors" th:value="${movie.actors}" required/>
                </div>

                <div class="mb-3">
                    <label for="rating" class="form-label">관람가</label>
                    <input type="text" class="form-control" id="rating" name="rating" th:value="${movie.rating}" required/>
                </div>

                <div class="mb-3">
                    <label for="runtime" class="form-label">러닝타임 (분)</label>
                    <input type="number" class="form-control" id="runtime" name="runtime" th:value="${movie.runtime}" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">영화 상태</label>
                    <div class="form-check">
                        <input type="radio" id="status1" name="status" value="상영 중" class="form-check-input" th:checked="${movie.status == '상영 중'}">
                        <label for="status1" class="form-check-label">상영 중</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="status2" name="status" value="상영 예정" class="form-check-input" th:checked="${movie.status == '상영 예정'}">
                        <label for="status2" class="form-check-label">상영 예정</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" id="status3" name="status" value="상영 종료" class="form-check-input" th:checked="${movie.status == '상영 종료'}">
                        <label for="status3" class="form-check-label">상영 종료</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="posterFile" class="form-label">포스터</label>
                    <input type="file" class="form-control" id="posterFile" name="posterFile" accept="image/*"/>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-outline-primary">수정 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>
